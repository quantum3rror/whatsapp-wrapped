name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build macOS app
        run: pyinstaller WhatsAppWrapped-GUI.spec

      - name: Zip macOS app
        run: cd dist && zip -r "../WhatsApp-Wrapped-macOS-${{ matrix.arch }}.zip" "WhatsApp Wrapped.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.arch }}
          path: WhatsApp-Wrapped-macOS-${{ matrix.arch }}.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Windows app
        run: pyinstaller WhatsAppWrapped-GUI.spec

      - name: Zip Windows app
        run: Compress-Archive "dist\WhatsApp Wrapped" WhatsApp-Wrapped-Windows.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: WhatsApp-Wrapped-Windows.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download macOS arm64 build
        uses: actions/download-artifact@v4
        with:
          name: macos-build-arm64

      - name: Download macOS x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: macos-build-x86_64

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WhatsApp-Wrapped-macOS-arm64.zip
            WhatsApp-Wrapped-macOS-x86_64.zip
            WhatsApp-Wrapped-Windows.zip
